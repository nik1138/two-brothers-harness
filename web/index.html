<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Two Brothers — a local coding workspace where a Senior and a Junior agent work through one shared context."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101115" media="(prefers-color-scheme: dark)" />
    <title>Two Brothers</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171a21'/%3E%3Ccircle cx='12.5' cy='16' r='6.5' fill='%23ffffff' fill-opacity='.92'/%3E%3Ccircle cx='19.5' cy='16' r='6.5' fill='%233568d4'/%3E%3C/svg%3E"
    />
    <style>
      /* Pre-paint scheme: the same key and rules as src/themeMode.ts. The
         stylesheet takes over once it loads; this only prevents a light
         flash on a dark workspace. */
      html {
        color-scheme: light;
        background: #f6f7f9;
      }

      html[data-theme='dark'] {
        color-scheme: dark;
        background: #101115;
      }

      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          color-scheme: dark;
          background: #101115;
        }
      }
    </style>
    <script>
      ;(function () {
        try {
          var key = 'two-brothers.theme'
          var saved = window.localStorage.getItem(key)
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            if (saved === 'system') document.documentElement.removeAttribute('data-theme')
            else document.documentElement.setAttribute('data-theme', saved)
          }
        } catch (error) {
          /* storage can be unavailable (private mode / blocked storage) */
        }
        try {
          // Pre-paint density: the same key and values as src/density.ts, so a
          // Compact workspace never flashes Comfortable spacing on load.
          var density = window.localStorage.getItem('two-brothers.density.v1')
          if (density === 'compact' || density === 'comfortable') {
            document.documentElement.setAttribute('data-density', density)
          }
        } catch (error) {
          /* storage can be unavailable (private mode / blocked storage) */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
