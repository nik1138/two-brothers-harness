# Release workflow: publish packages/harness (@two-brothers/harness) to npm.
#
# Auth is via npm Trusted Publisher (OIDC) — no registry token is stored or
# passed anywhere: npm >= 11 exchanges the GitHub OIDC token (id-token: write)
# for a short-lived publish token when the repo is linked to the package as a
# trusted publisher.
#
# ── Current state (2026-11-08) ──────────────────────────────────────────────
#
# The @two-brothers org exists and @two-brothers/harness@0.0.0 is a live
# placeholder, so the package settings page and Trusted Publisher UI are
# available. The next publish is the real 0.0.1.
#
# Trusted Publisher fields:
#   Organization/user:  nik1138 (the GitHub owner, not the npm org)
#   Repository:         two-brothers-harness
#   Workflow filename:  publish.yml (filename only)
#   Environment:        blank (no GitHub environment is used)
#   Allowed actions:    npm publish MUST be enabled. Configurations created
#                       after 2026-09-03 default to stage-only; this workflow
#                       runs direct `npm publish`, so stage-only is not enough.
#                       Enable npm dist-tag too only if CI should promote tags.
#
# A newly created trusted publisher must complete one successful publish within
# 2 days or it expires. Prefer GitHub → Actions → publish → Run workflow on
# `main` (workflow_dispatch); a `v*` tag is optional and must match the package
# version. The workflow runs the full gate before publishing with
# `--tag next`, so the release lands on the `next` dist-tag, not `latest`.
#
# Provenance: npm generates it automatically under trusted publishing for a
# public repository. It is not generated for private source repositories, so
# the publish step deliberately does not pass --provenance (a private repo
# would fail instead of publishing).
# ────────────────────────────────────────────────────────────────────────────

name: publish

on:
  push:
    tags: ['v*']
  # Lets the owner re-run the full gate + publish by hand after the one-time
  # npm setup below (GitHub → Actions → publish → Run workflow), without
  # needing to move or re-push the tag.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # OIDC token for npm Trusted Publisher
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # Release gate — mirrors .github/workflows/ci.yml, plus the web workspace
      # build that `prepack` copies into the tarball.
      # Every step is continue-on-error: false (the default): any failure
      # aborts before publish.
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/harness

      - name: Build
        run: npm run build
        working-directory: packages/harness

      - name: Test (in-process)
        run: npm test
        working-directory: packages/harness

      - name: Test (spawned)
        run: npm run test:spawn
        working-directory: packages/harness

      # Hermetic E2E layers from the PR gate (offline; loopback/temp dirs only).
      - name: Hermetic CLI E2E (sources)
        run: node e2e/cli.ts
        working-directory: packages/harness

      - name: Hermetic CLI E2E (dist)
        run: node e2e/cli.ts --dist
        working-directory: packages/harness

      - name: Real-socket fault injection
        run: node e2e/faults.ts
        working-directory: packages/harness

      # prepack copies web/dist into the tarball and fails when it is absent.
      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web

      - name: Build web workspace
        run: npm run build
        working-directory: web

      - name: Offline selftest
        run: node dist/selftest.js
        working-directory: packages/harness

      - name: Verify pack contents
        run: npm run pack:check
        working-directory: packages/harness

      # A tag must describe the version being published; a workflow_dispatch
      # run has no tag, so check only tag refs.
      - name: Verify tag matches the package version
        if: github.ref_type == 'tag'
        working-directory: packages/harness
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match packages/harness version $version"
            exit 1
          fi
          echo "tag v$tag matches packages/harness version $version"

      # Trusted Publisher OIDC token exchange requires npm CLI >= 11.5.1;
      # Node 22 still ships npm 10.x, so upgrade before publishing.
      - name: Install npm with Trusted Publisher support
        run: npm install --global npm@11

      # Trusted Publisher OIDC: no NODE_AUTH_TOKEN / npm token needed.
      # Provenance is automatic for a public repository under trusted
      # publishing; npm skips it for private source repositories, so do not
      # pass --provenance or the private case can fail the publish.
      - name: Publish to npm (dist-tag "next")
        run: npm publish --tag next
        working-directory: packages/harness
