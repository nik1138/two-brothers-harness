name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dev/test scripts run .ts sources directly (native type stripping),
        # which needs Node >= 22.6; the built dist/ and the shipped package
        # require Node >= 22.19 (the engines floor).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/harness

      - name: Build
        run: npm run build
        working-directory: packages/harness

      - name: Test (in-process)
        run: npm test
        working-directory: packages/harness

      - name: Test (spawned)
        run: npm run test:spawn
        working-directory: packages/harness

      - name: Offline selftest
        run: node dist/selftest.js
        working-directory: packages/harness

      - name: Mock end-to-end run
        run: node dist/cli.js run "ci smoke" --provider mock
        working-directory: packages/harness

      - name: Web install
        run: npm ci
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web
