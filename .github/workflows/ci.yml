name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dev/test scripts run .ts sources directly (native type stripping),
        # which needs Node >= 22.6; the built dist/ and the shipped package
        # require Node >= 22.19 (the engines floor).
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Zero-dependency protocol reference: no install step of its own, the
      # selftest and in-process suite run on the checked-in sources alone.
      - name: Protocol reference selftest
        run: node src/selftest.ts
        working-directory: typescript

      - name: Protocol reference tests
        run: node tests/run-all.ts
        working-directory: typescript

      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/harness

      - name: Build
        run: npm run build
        working-directory: packages/harness

      - name: Test (in-process)
        run: npm test
        working-directory: packages/harness

      - name: Test (spawned)
        run: npm run test:spawn
        working-directory: packages/harness

      - name: Offline selftest
        run: node dist/selftest.js
        working-directory: packages/harness

      - name: Mock end-to-end run
        run: node dist/cli.js run "ci smoke" --provider mock
        working-directory: packages/harness

      # Hermetic CLI E2E: drives the CLI as a real subprocess against the
      # mock provider (temp dirs, offline). Sources first, then `--dist` so
      # the built artifact is proven too. web/dist is not built yet at this
      # point, so the `serve` scenario asserts the expected 404 path.
      - name: Hermetic CLI E2E (sources)
        run: node e2e/cli.ts
        working-directory: packages/harness

      - name: Hermetic CLI E2E (dist)
        run: node e2e/cli.ts --dist
        working-directory: packages/harness

      # Real-socket fault injection: a scripted loopback node:http server drives
      # the package's real retry/timeout/overflow machinery over actual TCP
      # (no fetch stubs, no external network; ~0.3 s, sources only). Cheap
      # enough for both Node versions, so it is not gated to the 22 floor.
      - name: Real-socket fault-injection E2E
        run: node e2e/faults.ts
        working-directory: packages/harness

      # Hermetic server-status/prompt-audit suites. The override points the
      # runner at a closed loopback port, so the endpoint probe fails at once
      # and the live-model suites report SKIP; the hermetic suites still run
      # and the runner exits 0. (The browser E2E and live-model suites stay
      # opt-in/manual: CI has no system Edge/Playwright browser and no model
      # endpoint.)
      - name: Hermetic server E2E (no live endpoint)
        run: node e2e/run.ts
        working-directory: packages/harness
        env:
          TWO_BROTHERS_E2E_BASE_URL: http://127.0.0.1:9/v1

      - name: Web install
        run: npm ci
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      # The browser-E2E packaged-web freshness guard is plain node:test with no
      # dependencies and no browser (the Playwright suite itself stays manual),
      # so its staleness/auto-sync logic is proven here on a clean checkout.
      - name: Browser-E2E freshness unit tests
        run: node --test e2e/web-freshness.test.mjs

      # Release rehearsal: `npm pack` (whose prepack runs build + sync-web),
      # install the tarball in a fresh temp dir, then exercise the installed
      # selftest/CLI/.bin shim. Needs the package build and web/dist, hence
      # it runs after the web build. The packed artifact does not depend on
      # the Node version running the job, so the two heavier release checks
      # run once, on the Node 22 engines floor.
      - name: Tarball install smoke
        if: matrix.node == 22
        run: node scripts/tarball-smoke.mjs

      # publint + attw on the packed tarball (package-format analysis; the
      # prepack it triggers also needs the web build). No network beyond npm.
      - name: Packaging checks (publint + attw)
        if: matrix.node == 22
        run: npm run pack:check
        working-directory: packages/harness
